<!doctype html>
<html lang="en" data-replay="demo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hindsight</title>
  <meta name="description" content="A chat agent that searches the web, cites its sources, and remembers what it told you and when.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-view="welcome">
  <canvas class="cosmos" id="cosmos" aria-hidden="true"></canvas>
  <a class="skip" href="#ask">Skip to the question box</a>

  <header class="bar">
    <a class="wordmark" href="#/" aria-label="Hindsight, new conversation">hindsight</a>
    <p class="bar__model readout" id="model-line"></p>
    <button class="ghost" type="button" aria-controls="memory" aria-expanded="false" data-action="toggle-memory">Memory <span class="readout" id="memory-count"></span></button>
    <a class="ghost" href="#/" data-action="new">New</a>
  </header>

  <div class="clock-panel" id="clock-panel" popover>
    <form class="clock-panel__form" id="clock-form">
      <h2>Time travel</h2>
      <p class="clock-panel__note">Move the agent’s clock to test memory: talk “on Monday”, come back to now, and ask what changed. Web search always sees today.</p>
      <label for="clock-input">Pretend it is</label>
      <input id="clock-input" name="at" type="datetime-local" required>
      <div class="clock-panel__actions">
        <button class="pill pill--primary" type="submit">Set the clock</button>
        <button class="pill" type="button" data-action="clock-reset">Back to now</button>
      </div>
    </form>
  </div>

  <nav class="memory" id="memory" aria-label="Past conversations">
    <div class="memory__head">
      <h2>Memory</h2>
      <button class="ghost" type="button" data-action="toggle-memory">Close</button>
    </div>
    <div id="memory-list" class="memory__list" aria-busy="true">
      <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </nav>

  <main class="main" id="main">
    <section class="hero" id="hero"></section>
    <section class="thread" id="thread" aria-live="off"></section>

    <div class="dock" id="dock">
      <form class="composer" id="composer">
        <label class="visually-hidden" for="ask">Your question</label>
        <textarea id="ask" name="message" rows="2" placeholder="Ask about anything current, or about something we discussed" autocomplete="off" enterkeyhint="send"></textarea>
        <div class="composer__row">
          <button class="round round--quiet clock" type="button" popovertarget="clock-panel" id="clock-button" aria-label="Time travel: change the date the agent believes it is">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <span class="composer__date readout" id="clock-label">Today</span>
          <span class="composer__model readout" id="model-chip"></span>
          <button class="round round--primary" type="submit" id="send" aria-label="Ask">
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 18V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
      </form>
      <ul class="starters" id="starters"></ul>
      <p class="dock__hint">Enter sends. Shift and Enter for a new line.</p>
    </div>
    <p class="visually-hidden" role="status" id="announcer"></p>
  </main>

  <noscript><p class="noscript">Hindsight needs JavaScript to talk to its server.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
