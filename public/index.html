<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hindsight</title>
  <meta name="description" content="A chat agent that searches the web, cites its sources, and remembers what it told you and when.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#ask">Skip to the question box</a>

  <header class="bar">
    <div class="bar__pill">
      <button class="bar__menu" type="button" aria-controls="memory" aria-expanded="false" data-action="toggle-memory">memory</button>
      <a class="wordmark" href="#/" aria-label="Hindsight, new conversation">hindsight</a>
      <p class="bar__model readout" id="model-line"></p>
      <button class="clock" type="button" popovertarget="clock-panel" id="clock-button" aria-describedby="clock-hint">
        <span class="clock__label readout" id="clock-label">today</span>
      </button>
      <span class="visually-hidden" id="clock-hint">Change the date the agent believes it is</span>
      <a class="pill" href="#/" data-action="new">new</a>
    </div>
  </header>

  <div class="clock-panel" id="clock-panel" popover>
    <form class="clock-panel__form" id="clock-form">
      <h2>time travel</h2>
      <p class="clock-panel__note">Move the agent’s clock to test memory: talk “on Monday”, come back to now, and ask what changed. Web search always sees today.</p>
      <label for="clock-input">pretend it is</label>
      <input id="clock-input" name="at" type="datetime-local" required>
      <div class="clock-panel__actions">
        <button class="pill pill--primary" type="submit">set the clock</button>
        <button class="pill" type="button" data-action="clock-reset">back to now</button>
      </div>
    </form>
  </div>

  <div class="layout">
    <nav class="memory" id="memory" aria-label="Past conversations">
      <div class="memory__head">
        <h2>memory</h2>
        <p class="memory__count readout" id="memory-count"></p>
      </div>
      <div id="memory-list" class="memory__list" aria-busy="true">
        <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </nav>

    <main class="main" id="main">
      <section class="thread" id="thread" aria-live="off"></section>

      <div class="dock">
        <form class="composer" id="composer">
          <label class="visually-hidden" for="ask">Your question</label>
          <textarea id="ask" name="message" rows="1" placeholder="Ask about anything current, or about something we discussed" autocomplete="off" enterkeyhint="send"></textarea>
          <button class="pill pill--primary" type="submit" id="send">ask</button>
        </form>
        <p class="dock__hint">Enter sends. Shift and Enter for a new line.</p>
      </div>
      <p class="visually-hidden" role="status" id="announcer"></p>
    </main>
  </div>

  <noscript><p class="noscript">Hindsight needs JavaScript to talk to its server.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
