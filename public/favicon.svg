<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 75">
  <style>
    text {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      font-weight: 700;
      font-size: 68px;
      letter-spacing: -0.04em;
      fill: #ffffff;
    }
    .dot {
      fill: #e05535;
    }
    @media (prefers-color-scheme: light) {
      text {
        fill: #0d0e12;
      }
    }
  </style>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central">hindsight<tspan class="dot">.</tspan></text>
</svg>
